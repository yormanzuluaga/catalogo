<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Panel de Administración</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Panel de Administración</h1>
            <div id="alert" class="alert"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertDiv = document.getElementById('alert');

            try {
                const response = await api.login(email, password);

                // Verificar que el usuario sea administrador
                // El backend usa 'rol' no 'role'
                const userRole = response.user.rol || response.user.role;
                if (userRole !== 'ADMIN_ROLE') {
                    alertDiv.textContent = 'No tienes permisos de administrador';
                    alertDiv.className = 'alert alert-error show';
                    api.removeToken();
                    return;
                }

                alertDiv.textContent = 'Inicio de sesión exitoso';
                alertDiv.className = 'alert alert-success show';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                alertDiv.textContent = error.message || 'Error al iniciar sesión';
                alertDiv.className = 'alert alert-error show';
            }
        });

        // Si ya está autenticado, redirigir al dashboard
        if (localStorage.getItem('adminToken')) {
            const user = JSON.parse(localStorage.getItem('adminUser') || '{}');
            const userRole = user.rol || user.role;
            if (userRole === 'ADMIN_ROLE') {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
